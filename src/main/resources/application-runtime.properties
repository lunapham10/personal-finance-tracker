spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_RUNTIME_USER}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# HashiCorp Vault - runtime secret retrieval
spring.config.import=vault:///secret/personal-finance-tracker

spring.cloud.vault.uri=http://127.0.0.1:8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.fail-fast=true

spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.backend-version=2

# OPA secure service-to-service communication
app.opa.url=https://localhost:8181
app.opa.ssl-bundle=opa-client

# Spring PEP client identity and OPA trust
spring.ssl.bundle.pem.opa-client.keystore.certificate=file:./tls/generated/spring-pep.crt
spring.ssl.bundle.pem.opa-client.keystore.private-key=file:./tls/generated/spring-pep.key
spring.ssl.bundle.pem.opa-client.truststore.certificate=file:./tls/generated/ca.crt